[project]
name = "pist"
version = "0.6.0"
description = "Celeste Mod map first-playthrough tracker for Tencent Docs Smart Sheets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "berries>=0.2.0,<0.3.0",
    "aiohttp>=3.11.0",
    "luaparser>=4.1.0",
    "pydantic>=2.12.0",
    "typing-extensions>=4.16.0",
    "tomlkit>=0.15.1",
    "platformdirs>=4.11.7",
    "keyring>=25.6.0",
    "rich>=14.0.0",
    "textual>=8.2.8",
]

[project.scripts]
pist = "pist.__main__:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"
