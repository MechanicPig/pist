<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图预览</title>
<link rel="stylesheet" href="assets/map_preview.css">
<link rel="stylesheet" href="assets/object_info.css">
</head>
<body>
<header>
  <h1 id="title">地图预览</h1>
  <button id="fit" class="secondary">适应画布</button>
  <button id="back" class="secondary">后退</button>
  <button id="forward" class="secondary">前进</button>
  <button id="home" class="secondary">返回起点</button>
</header>
<main>
  <canvas id="map"></canvas>
  <aside>
    <input id="filter" placeholder="筛选房间名">
    <div id="rooms"></div>
    <div id="hint">滚轮缩放，中键或右键拖动画布；双击房间以定位。</div>
  </aside>
</main>
<section id="object-info" class="object-info" hidden>
  <div data-role="header"><strong id="object-id" data-role="id"></strong><button id="object-close" data-role="close" class="secondary">关闭</button></div>
  <span id="object-source" data-role="source"></span>
  <pre id="object-attrs" data-role="attrs"></pre>
  <div data-role="actions"></div>
</section>
<div id="status" hidden></div>
<script type="module" src="assets/map_preview.js"></script>
</body>
</html>
