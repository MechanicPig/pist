[project]
name = "berries"
version = "0.2.0"
description = "Reusable Python tools for reading Celeste and Everest Mod content."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["celeste", "everest", "modding", "maps"]
dependencies = [
    "aiohttp>=3.11.0",
    "annotated-types>=0.7.0",
    "platformdirs>=4.11.7",
    "pydantic>=2.12.0",
    "pydantic-core>=2.41.0",
    "pyyaml>=6.0.3",
    "tomlkit>=0.15.1",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"
