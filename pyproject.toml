[project]
name = "pist"
version = "0.5.1"
description = "Celeste Mod map first-playthrough tracker for Tencent Docs Smart Sheets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "berries>=0.1.0,<0.2.0",
    "aiohttp>=3.11.0",
    "luaparser>=4.1.0",
    "pydantic>=2.12.0",
    "typing-extensions>=4.16.0",
    "tomlkit>=0.15.1",
    "platformdirs>=4.11.7",
    "keyring>=25.6.0",
    "rich>=14.0.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
pist = "pist.__main__:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
berries = { workspace = true }

[tool.uv.workspace]
members = ["packages/berries"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
enableExperimentalFeatures = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["UP010"]

[tool.ruff.format]
quote-style = "single"
