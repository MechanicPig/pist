[project]
name = "pist"
version = "0.1.0"
description = "Celeste Mod map first-playthrough tracker for Tencent Docs Smart Sheets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.11.0",
    "keyring>=25.6.0",
    "luaparser>=4.1.0",
    "pydantic>=2.12.0",
    "typing-extensions>=4.16.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[project.scripts]
pist = "pist.__main__:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
enableExperimentalFeatures = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
quote-style = "single"
