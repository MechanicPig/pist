[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[tool.uv.sources]
berries = { workspace = true }

[tool.uv.workspace]
members = ["berries", "pist"]

[tool.pytest.ini_options]
testpaths = ["berries/tests", "pist/tests", "tests"]
pythonpath = ["tests"]

[tool.pyright]
enableExperimentalFeatures = true
extraPaths = ["tests"]

[tool.ruff]
src = ["berries/src", "pist/src", "tests"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["UP010"]

[tool.ruff.format]
quote-style = "single"
